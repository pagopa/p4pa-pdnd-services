rest:
  defaults:
    connection-pool:
      size: "\${DEFAULT_REST_CONNECTION_POOL_SIZE:10}"
      size-per-route: "\${DEFAULT_REST_CONNECTION_POOL_SIZE_PER_ROUTE:5}"
      time-to-live-minutes: "\${DEFAULT_REST_CONNECTION_POOL_TIME_TO_LIVE_MINUTES:10}"
    timeout:
      connect-millis: "\${DEFAULT_REST_TIMEOUT_CONNECT_MILLIS:120000}"
      read-millis: "\${DEFAULT_REST_TIMEOUT_READ_MILLIS:120000}"
  pdnd:
    base-url: "\${PDND_BASE_URL:https://auth.uat.interop.pagopa.it}"
    max-attempts: "\${PDND_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${PDND_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${PDND_PRINT_BODY_WHEN_ERROR:true}"
    config:
      env: "\${ENV:dev}"
      user-id: "\${PDND_AUTH_USERID:pdnd-user}"
      audience: "\${PDND_ACCESS_TOKEN_AUDIENCE:auth.uat.interop.pagopa.it/client-assertion}"
      auth-expiration-minutes: "\${PDND_AUTH_EXPIRATION_MINUTES:10}"
  anpr:
    base-url: "\${ANPR_BASE_URL:http://p4pa-mocks-microservice-chart:8080}\${ANPR_SERVICES_BASE_PATH:/govway/rest/in/MinInternoPortaANPR-PDND}"
    max-attempts: "\${PDND_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${PDND_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${PDND_PRINT_BODY_WHEN_ERROR:true}"
    https:
      trust-all: "\${ANPR_TRUST_ALL:false}"
    services:
      c003:
        base-path: "\${PDND_SERVICE_ANPR_C003_BASE_PATH:/C003-servizioVerificaDichGeneralita/v1}"
        audience: "\${PDND_SERVICE_ANPR_C003_AUDIENCE:C003audience}"
      c030:
        base-path: "\${PDND_SERVICE_ANPR_C030_BASE_PATH:/C030-servizioAccertamentoIdUnicoNazionale/v1/}"
        audience: "\${PDND_SERVICE_ANPR_C030_AUDIENCE:C030audience}"
  send:
    base-url: "\${SEND_BASE_URL:https://api.uat.notifichedigitali.it}"
    service:
      base-path: "\${PDND_SERVICE_SEND_BASE_PATH:}"
  organization:
    base-url: "\${ORGANIZATION_BASE_URL:}"
    max-attempts: "\${ORGANIZATION_MAX_ATTEMPTS:3}" # It's counting also the first attempt
    wait-time-millis: "\${ORGANIZATION_WAIT_TIME_MILLIS:500}"
    print-body-when-error: "\${ORGANIZATION_PRINT_BODY_WHEN_ERROR:true}"

cache:
  anpr-ids:
    size: "\${CACHE_ANPR_IDS_SIZE:1000}"
    expire-in: "\${CACHE_ANPR_IDS_MINUTES:60}"